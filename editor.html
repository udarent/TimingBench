<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimingBench</title>
<meta name="author" content="udarent">
<meta name="email" content="helloyuechen@163.com">
<meta name="version" content="0.27.5">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<!-- 全局动作：撤销 / 重做 / 分屏方向 / 生成嵌入代码（连线 0.9.17 起移到底部动作行）。这些与画布内容无关，
     左右分栏时横跨两栏；画布内不再画 HUD。 -->
<header class="topbar" id="topbar" role="toolbar" aria-label="Editor actions"></header>
<div class="app" id="app">
  <div class="pane src">
    <div class="gutter" id="gutter" aria-hidden="true"></div>
    <textarea id="code" spellcheck="false" wrap="off" aria-label="WaveJSON source"></textarea>
    <div class="errdot" id="errdot" hidden></div>
  </div>
  <!-- 两栏之间可拖动的分隔条：默认 50/50，拖到哪儿记到哪儿（双击 / Enter 回 50%）。
       role=separator + tabindex 让它可被键盘取到（左右方向键每次 2%，Shift 10%）。 -->
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"
       aria-label="Resize panes" aria-valuemin="10" aria-valuemax="90" aria-valuenow="50" tabindex="0"></div>
  <div class="pane diagram">
    <div class="svgwrap" id="svgwrap" aria-label="Editable timing diagram canvas"></div>
    <!-- 波形区自己的两条：上排是选中对象的动作，下排是字符输入。
         它们只作用于波形，所以收在波形区里 —— 不再横跨整个页面、也不盖在代码区下面。
         0.26.0：没有「⋯」溢出层了 —— 放不下就换行，停靠区变高、画布让位。 -->
    <div class="dockzone" id="dockzone">
      <div class="tbpanel" id="tbpanel" role="toolbar" aria-label="Row and column actions"></div>
      <div class="chardock" id="chardock" role="toolbar" aria-label="Wave characters"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
