<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimingBench</title>
<meta name="author" content="udarent">
<meta name="email" content="helloyuechen@163.com">
<meta name="version" content="0.9.0">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<nav class="tabbar" id="tabbar" role="tablist" aria-label="Switch view">
  <button type="button" role="tab" data-view="diagram" aria-selected="true" aria-label="Timing diagram" data-name="Timing diagram"><svg class="tabico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 16h3v-7h4v7h4V9h4v7h3"/></svg></button>
  <button type="button" role="tab" data-view="src" aria-selected="false" aria-label="Source" data-name="Source"><svg class="tabico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></button>
  <span class="tb-title">TimingBench</span>
</nav>
<div class="app" id="app" data-view="diagram">
  <div class="pane src">
    <div class="gutter" id="gutter" aria-hidden="true"></div>
    <textarea id="code" spellcheck="false" wrap="off" aria-label="WaveJSON source"></textarea>
    <div class="errdot" id="errdot" hidden></div>
  </div>
  <div class="pane diagram">
    <div class="svgwrap" id="svgwrap" aria-label="Editable timing diagram canvas"></div>
  </div>
</div>
<div class="touchbar" id="touchbar" role="toolbar" aria-label="Touch toolbar">
  <button type="button" data-tb="undo" aria-label="Undo" data-name="Undo"><span class="ico">↶</span></button>
  <button type="button" data-tb="redo" aria-label="Redo" data-name="Redo"><span class="ico">↷</span></button>
  <button type="button" data-tb="link" aria-pressed="false" aria-label="Link mode" data-name="Link mode"><span class="ico">◇</span></button>
  <button type="button" data-tb="cancel" aria-label="Cancel" data-name="Cancel"><span class="ico">✕</span></button>
</div>
<div class="tbpanel" id="tbpanel"></div>
<div class="charmore" id="charmore" role="toolbar" aria-label="All wave characters"></div>
<div class="chardock" id="chardock" role="toolbar" aria-label="Wave characters"></div>
<button type="button" class="embedhint" id="embedhint" aria-label="Edit this timing diagram" aria-pressed="false"><svg class="hintico hintico-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16v4z"/><path d="M14.5 5.5l4 4"/></svg><svg class="hintico hintico-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l5 5L20 7"/></svg></button>
<div class="toast" id="toast" aria-live="polite"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
